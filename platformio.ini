; DomoC — Configurazione PlatformIO
; Compila: pio run -e <env>
; Upload:  pio run -e <env> -t upload
; Monitor: pio device monitor -e <env>

[platformio]
src_dir     = Code/nodes_arduino
default_envs = step

; ─── Base comune a tutti gli ambienti ────────────────────────────────────────
[env]
framework    = arduino
monitor_speed = 115200
; painlessMesh/ESPAsyncTCP non è compatibile con Arduino core 3.x (IDF 5.x):
; pinniamo al platform 5.x che usa IDF 4.4
platform     = espressif32@~5.4.0
lib_extra_dirs = Code/arduino_lib
; ESPAsyncTCP è per ESP8266 — su ESP32 painlessMesh usa AsyncTCP (già incluso).
; Senza questo, il LDF compila entrambi e ESPAsyncTCP fallisce.
lib_ignore   = ESPAsyncTCP
build_flags  =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_ARDUHAL_LOG_COLORS=1

; ─── Nodi ESP32-S3-MINI-1 (PCB Universale v3.0) ──────────────────────────────

[env:step]
board     = esp32-s3-devkitc-1
board_build.partitions = huge_app.csv
build_src_filter = -<*> +<step/>
lib_deps  =
    fastled/FastLED
    painlessMesh
    adafruit/Adafruit SHT31 Library
    adafruit/Adafruit BusIO

[env:grey_water]
board     = esp32-s3-devkitc-1
board_build.partitions = huge_app.csv
build_src_filter = -<*> +<grey_water/>
lib_deps  =
    fastled/FastLED
    painlessMesh

[env:fresh_water]
board     = esp32-s3-devkitc-1
board_build.partitions = huge_app.csv
build_src_filter = -<*> +<fresh_water/>
lib_deps  =
    fastled/FastLED
    painlessMesh

; ─── Nodi ESP32-C3 (MASTER + termostati) ─────────────────────────────────────

[env:master]
board     = esp32-c3-devkitm-1
build_src_filter = -<*> +<master/>
lib_deps  =
    fastled/FastLED
    painlessMesh

[env:thermo_bunk]
board     = esp32-c3-devkitm-1
build_src_filter = -<*> +<thermo_bunk/>
lib_deps  =
    fastled/FastLED
    painlessMesh
    paulstoffregen/OneWire
    milesburton/DallasTemperature

[env:thermo_loft]
board     = esp32-c3-devkitm-1
build_src_filter = -<*> +<thermo_loft/>
lib_deps  =
    fastled/FastLED
    painlessMesh
    paulstoffregen/OneWire
    milesburton/DallasTemperature

[env:thermo_kitchen]
board     = esp32-c3-devkitm-1
build_src_filter = -<*> +<thermo_kitchen/>
lib_deps  =
    fastled/FastLED
    painlessMesh
    paulstoffregen/OneWire
    milesburton/DallasTemperature

; ─── HMI (ESP32-S3R8, 8 MB PSRAM) ───────────────────────────────────────────
; Fase 3 — ora stub senza LVGL

[env:hmi]
board     = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
build_src_filter = -<*> +<hmi/>
lib_deps  =
    painlessMesh

; ─── Telecamere ESP32-CAM (NO mesh) ──────────────────────────────────────────

[env:rear]
board     = esp32cam
build_src_filter = -<*> +<rear/>
lib_deps  =

[env:cam_ext]
board     = esp32cam
build_src_filter = -<*> +<cam_ext/>
lib_deps  =
