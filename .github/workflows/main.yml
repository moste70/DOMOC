name: Build DomoC nodes

on: [push, pull_request]

jobs:
  build-step:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.1
    steps:
      - uses: actions/checkout@v4
      - name: Build STEP node
        working-directory: Code/nodes/step
        run: |
          idf.py set-target esp32s3
          idf.py build
