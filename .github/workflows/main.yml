name: Build DomoC nodes

on: [push, pull_request]

jobs:
  build-step:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify project structure
        run: |
          echo "=== Repository structure ==="
          ls -la Code/nodes/step/
          echo ""
          echo "=== Base component ==="
          ls -la Code/Base/
          echo ""
          echo "=== STEP main ==="
          ls -la Code/nodes/step/main/
      - name: Build STEP node
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v5.2
          target: esp32s3
          path: 'Code/nodes/step'
