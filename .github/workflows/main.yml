name: DomoC Tests

on: [push, pull_request]

jobs:
  test-host:
    name: Host-based unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++
      - name: Run unit tests
        run: |
          cd Code/tests
          bash run_tests.sh
