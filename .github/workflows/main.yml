name: Build DomoC nodes

on: [push, pull_request]

jobs:
  build-step:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.2
    steps:
      - uses: actions/checkout@v4
      - name: Build STEP node
        working-directory: Code/nodes/step
        shell: bash
        run: |
          . $IDF_PATH/export.sh 2>/dev/null || true
          idf.py set-target esp32s3
          idf.py build 2>&1 | tee /tmp/build.log; exit ${PIPESTATUS[0]}
      - name: Show build errors on failure
        if: failure()
        run: |
          echo "=== LAST 80 LINES OF BUILD LOG ==="
          tail -80 /tmp/build.log || echo "No build log found"
