name: Build DomoC nodes

on: [push, pull_request]

jobs:
  test-host:
    name: Host-based unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++
      - name: Run unit tests
        run: |
          cd Code/tests
          bash run_tests.sh

  build-step:
    name: Build STEP firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.2
    steps:
      - uses: actions/checkout@v4

      - name: Build STEP node
        run: |
          cd Code/nodes/step
          . ${IDF_PATH}/export.sh
          idf.py set-target esp32s3
          idf.py build
