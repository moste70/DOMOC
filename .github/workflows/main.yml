name: Build DomoC nodes

on: [push, pull_request]

jobs:
  build-step:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.2
    steps:
      - uses: actions/checkout@v4

      - name: Build STEP node
        run: |
          cd Code/nodes/step
          . ${IDF_PATH}/export.sh
          idf.py set-target esp32s3
          idf.py build
